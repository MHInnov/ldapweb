{% import "macros.html" as m %}
<dialog class="modal {{ size }}">
  <form class="dlg-form" hx-post="{{ action }}" hx-swap="none">
  {% for h in hidden %}<input type="hidden" name="{{ h.0 }}" value="{{ h.1 }}">{% endfor %}
  <div class="dlg-head"><h2>{% call m::icon(icon) %}{% endcall %}<span>{{ title }}</span></h2><button type="button" class="icon-btn" data-close>{% call m::icon("close") %}{% endcall %}</button></div>
  <div class="dlg-body">{{ body|safe }}</div>
  <div class="dlg-foot"><button type="button" data-close>Annuler</button>{% if !submit.is_empty() %}<button type="submit" class="{{ submit_class }}">{{ submit }}</button>{% endif %}</div>
  </form>
</dialog>
