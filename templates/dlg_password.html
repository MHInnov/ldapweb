{% import "macros.html" as m %}
<dialog class="modal narrow">
  <form class="dlg-form" hx-post="/obj/password" hx-swap="none" autocomplete="off">
  <input type="hidden" name="dn" value="{{ dn }}">
  <div class="dlg-head"><h2>{% call m::icon("key") %}{% endcall %}<span>Réinitialiser le mot de passe</span></h2><button type="button" class="icon-btn" data-close>{% call m::icon("close") %}{% endcall %}</button></div>
  <div class="dlg-body">
    <p><strong>{{ name }}</strong><br><span class="small muted mono">{{ dn }}</span></p>
    <div class="form-grid">
      <label for="np1-{{ uid }}">Nouveau mot de passe</label>
      <div class="inline"><input type="password" name="password" id="np1-{{ uid }}" required autofocus autocomplete="new-password"><button type="button" class="btn-sm" data-action="genpw" data-targets="np1-{{ uid }},np2-{{ uid }}">Générer</button></div>
      <label for="np2-{{ uid }}">Confirmer</label><input type="password" name="password2" id="np2-{{ uid }}" required autocomplete="new-password">
    </div>
    <div class="checks" style="margin-top:12px">
      <label><input type="checkbox" name="must_change" checked> L'utilisateur doit changer le mot de passe à la prochaine ouverture de session</label>
      <label><input type="checkbox" name="unlock" {% if locked %}checked{% endif %}> Déverrouiller le compte{% if locked %} <span class="badge danger">actuellement verrouillé</span>{% endif %}</label>
    </div>
  </div>
  <div class="dlg-foot"><button type="button" data-close>Annuler</button><button type="submit" class="btn-primary">Réinitialiser</button></div>
  </form>
</dialog>
