{% if !note.is_empty() %}<div class="notice {{ note_level }}">{{ note }}</div>{% endif %}
{% for s in sections %}
{% if !s.title.is_empty() %}<h3>{{ s.title }}</h3>{% endif %}
<dl class="kv">{% for r in s.rows %}<dt>{{ r.0 }}</dt><dd class="{% if r.2 %}mono{% endif %}">{{ r.1 }}</dd>{% endfor %}</dl>
{% endfor %}
{{ extra|safe }}
