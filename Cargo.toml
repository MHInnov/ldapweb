[package]
name = "arbor"
version = "0.1.0"
edition = "2024"
description = "Arbor — console web d'administration d'annuaires LDAP (Active Directory, Samba AD, OpenLDAP, 389-DS) et des services connexes (DNS, DHCP, GPO, Kerberos, PKI)"
rust-version = "1.85"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
axum = { version = "0.8", features = ["multipart", "form", "query"] }
axum-server = { version = "0.9", default-features = false, features = ["tls-rustls-ring"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "trace", "set-header", "timeout", "limit"] }
askama = "0.16"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"

# LDAP & TLS (pure Rust : aucune dépendance OpenSSL, compile sous Windows et Linux)
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
x509-parser = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
csv = "1"
percent-encoding = "2"

# Kerberos (dérivation de clés pour la génération de keytabs)
aes = "0.8"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = "0.10"
md4 = "0.10"
sha2 = "0.10"

[features]
default = []
# Intégration native au gestionnaire de services Windows (SCM) : `arbor service ...`
windows-service = ["dep:windows-service"]

[target.'cfg(windows)'.dependencies]
windows-service = { version = "0.8", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
